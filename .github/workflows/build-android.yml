name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🎨 Prepare www (web assets)
        run: |
          mkdir -p www
          # Копируем index.html в www (webDir из capacitor.config.json)
          cp index.html www/index.html
          # Если есть другие веб-ассеты (css, js, images) — добавьте их сюда
          ls -la www/

      - name: 🖼️ Generate icons & splash
        run: node make-icons.js

      - name: 🔧 Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🎨 Capacitor Assets (icons + splash into android)
        run: |
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#050d1c' \
            --splashBackgroundColor '#050d1c' \
            --splashBackgroundColorDark '#050d1c'

      - name: 🏗️ Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-world-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Create/Update Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
